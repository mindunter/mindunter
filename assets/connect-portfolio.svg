<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" role="img" aria-labelledby="t">
  <title id="t">Portfolio — mindunter.framer.website</title>
  <style>
    :root { --bg:#ffffff; --fg:#0f172a; --muted:#64748b; --a:#0055ff; --b:#9333ea; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --a:#60a5fa; --b:#c084fc; } }
    .sa { stop-color: var(--a); } .sb { stop-color: var(--b); }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .in { fill: var(--bg); }
    .glow { opacity: .14; animation: breathe 3.2s ease-in-out infinite; }
    .wrap { opacity: 0; animation: fade .6s ease-out .1s forwards; }
    .ic { fill: none; stroke: var(--a); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: bob 3s ease-in-out 1s infinite; }
    .ic .fillc { fill: var(--a); stroke: none; }
    .label { font-size: 16px; font-weight: 700; fill: var(--fg); }
    .sub { font-size: 12.5px; fill: var(--muted); }
    .arrow { fill: none; stroke: var(--a); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; animation: nudge 1.6s ease-in-out 1s infinite; }
    .spin { animation: spin 6s linear infinite; transform-origin: 140px 32px; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px) rotate(-6deg); } }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
    @keyframes breathe { 0%,100% { opacity: .10; } 50% { opacity: .22; } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="sa"/><stop offset="1" class="sb"/></linearGradient>
    <clipPath id="c"><rect x="0" y="0" width="280" height="64" rx="32"/></clipPath>
  </defs>
  <g class="wrap">
    <g clip-path="url(#c)">
      <rect width="280" height="64" fill="url(#g)"/>
      <rect class="spin" x="-60" y="28" width="400" height="8" fill="#ffffff" opacity=".35"/>
      <rect class="in" x="2" y="2" width="276" height="60" rx="30"/>
      <rect class="glow" x="2" y="2" width="276" height="60" rx="30" fill="url(#g)"/>
    </g>
    <g transform="translate(36 32)"><g class="ic"><circle cx="0" cy="0" r="10"/><ellipse cx="0" cy="0" rx="4.5" ry="10"/><path d="M-10 0H10"/></g></g>
    <text class="label" x="62" y="28">Portfolio</text>
    <text class="sub" x="62" y="46">mindunter.framer.website</text>
    <path class="arrow" d="M244 26L250 32L244 38"/>
  </g>
</svg>
