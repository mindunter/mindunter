<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-labelledby="t d">
  <title id="t">Hi, I'm Mindhunter</title>
  <desc id="d">Developer building education platforms, audio tooling, and local-first AI.</desc>
  <style>
    :root { --bg1:#eef2ff; --bg2:#f0fdf4; --fg:#0f172a; --muted:#475569; --a:#2563eb; --b:#16a34a; --c:#9333ea; }
    @media (prefers-color-scheme: dark) {
      :root { --bg1:#0b1220; --bg2:#0f1a14; --fg:#e2e8f0; --muted:#94a3b8; --a:#60a5fa; --b:#4ade80; --c:#c084fc; }
    }
    .bg1 { stop-color: var(--bg1); } .bg2 { stop-color: var(--bg2); }
    .sa { stop-color: var(--a); } .sb { stop-color: var(--b); } .sc { stop-color: var(--c); }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 40px; font-weight: 800; fill: var(--fg); opacity: 0; animation: rise .8s ease-out .1s forwards; }
    .sub { font-size: 17px; fill: var(--muted); opacity: 0; animation: rise .8s ease-out .5s forwards; }
    .wave { transform-origin: 70% 70%; transform-box: fill-box; display: inline-block; animation: wave 2.4s ease-in-out 1s infinite; }
    .blob { opacity: .35; animation: drift 12s ease-in-out infinite alternate; }
    .blob2 { animation-duration: 16s; animation-delay: -4s; }
    .line { stroke-dasharray: 360; stroke-dashoffset: 360; animation: draw 1.2s ease-out .9s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes wave { 0%,60%,100% { transform: rotate(0); } 10%,30% { transform: rotate(14deg); } 20%,40% { transform: rotate(-8deg); } }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(-60px,20px) scale(1.15); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="bg1"/><stop offset="1" class="bg2"/></linearGradient>
    <linearGradient id="ln" x1="0" x2="1"><stop offset="0" class="sa"/><stop offset=".5" class="sc"/><stop offset="1" class="sb"/></linearGradient>
    <radialGradient id="ga"><stop offset="0" class="sa"/><stop offset="1" class="sa" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb"><stop offset="0" class="sc"/><stop offset="1" class="sc" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="860" height="200" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="860" height="200" fill="url(#bg)"/>
    <circle class="blob" cx="760" cy="40" r="140" fill="url(#ga)"/>
    <circle class="blob blob2" cx="640" cy="190" r="120" fill="url(#gb)"/>
  </g>
  <text class="title" x="430" y="92" text-anchor="middle">Hi, I'm Mindhunter <tspan class="wave">👋</tspan></text>
  <path class="line" d="M250 112 H610" stroke="url(#ln)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <text class="sub" x="430" y="148" text-anchor="middle">Building education platforms · audio tooling · local-first AI</text>
</svg>
