<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" role="img" aria-labelledby="t">
  <title id="t">Redline Design School</title>
  <style>
    :root { --bg:#ffffff; --border:#e2e8f0; --fg:#0f172a; --muted:#475569; --accent:#dc2626; --chip:#f1f5f9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --border:#30363d; --fg:#e6edf3; --muted:#8b949e; --accent:#f87171; --chip:#161b22; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: var(--bg); stroke: var(--border); }
    .bar { fill: var(--accent); transform-origin: left; transform: scaleX(0); animation: grow .9s cubic-bezier(.2,.8,.2,1) .1s forwards; }
    .shine { fill: var(--accent); opacity: .12; animation: sweep 4s ease-in-out 1.5s infinite; }
    .title { font-size: 21px; font-weight: 700; fill: var(--fg); opacity: 0; animation: fade .6s ease-out .2s forwards; }
    .desc { font-size: 14px; fill: var(--muted); opacity: 0; animation: fade .6s ease-out forwards; }
    .tag { opacity: 0; animation: fade .5s ease-out forwards; }
    .tag rect { fill: var(--chip); stroke: var(--accent); stroke-opacity: .5; }
    .tag text { font-size: 12px; font-weight: 600; fill: var(--accent); }
    .dot { fill: var(--accent); animation: pulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .4; } }
    @keyframes sweep { 0% { transform: translateX(-160px); } 60%,100% { transform: translateX(560px); } }
  </style>
  <defs><clipPath id="c"><rect x=".5" y=".5" width="419" height="219" rx="12"/></clipPath></defs>
  <rect class="card" x=".5" y=".5" width="419" height="219" rx="12"/>
  <g clip-path="url(#c)">
    <rect class="bar" x="0" y="0" width="420" height="4"/>
    <g transform="skewX(-20)"><rect class="shine" x="0" y="0" width="80" height="220"/></g>
  </g>
  <text x="28" y="56" font-size="22">📐</text>
  <text class="title" x="62" y="55">Redline Design School</text>
  <circle class="dot" cx="392" cy="48" r="4"/>
  <text class="desc" x="28" y="98" style="animation-delay:0.35s">Free product design course — 9 modules,</text>
  <text class="desc" x="28" y="120" style="animation-delay:0.47s">27 lessons, each with an interactive lab.</text>
  <text class="desc" x="28" y="142" style="animation-delay:0.59s">Live on GitHub Pages ↗</text>
  <g class="tag" style="animation-delay:0.80s"><rect x="28" y="174" width="54" height="24" rx="12"/><text x="55.0" y="190.5" text-anchor="middle">HTML</text></g>
  <g class="tag" style="animation-delay:0.92s"><rect x="90" y="174" width="46" height="24" rx="12"/><text x="113.0" y="190.5" text-anchor="middle">CSS</text></g>
  <g class="tag" style="animation-delay:1.04s"><rect x="144" y="174" width="102" height="24" rx="12"/><text x="195.0" y="190.5" text-anchor="middle">JavaScript</text></g>
</svg>
